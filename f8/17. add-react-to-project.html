<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@17.0.0/umd/react.production.min.js"></script>

</head>

<body>
    <!--
            📌 So sánh React.createElement() với document.createElement():
            1. React.createElement() → Tạo React element
            2. document.createElement() → Tạo DOM element

            🛠 Các thao tác thường dùng:
            3- Thay đổi: id, className, style, ...
            4- Thêm nội dung: text, HTML

            🧪 Ví dụ:
            5🔹 Tạo một tiêu đề:
            <h1 title="Hello" class="heading">Hello guys!</h1>

            6🔹 Tạo danh sách:
            <ul>
                <li>Javascript</li>
                <li>ReactJS</li>
            </ul>

            7🔹 Tạo một khối bài viết:
            <div class="post-item">
                <h2 title="Học React tại F8">Học ReactJS</h2>
                <p>Học ReactJS từ cơ bản tới nâng cao</p>
            </div>
    -->


    <script>
        // // DOM
        // const h1Dom= document.createElement('h1');

        // h1Dom.title= "Hello";
        // h1Dom.className= "heading";
        // h1Dom.innerText= "Hello guys!";

        // // thêm vào trang html
        // document.body.appendChild(h1Dom);

        // // React  --> React-Dom

        // // React.createElement{type, props, children , n}
        // const h1React= React.createElement('h1',{
        //     title: "hello",
        //     className: "heading"
        // }, "Hello guys!")

        // console.dir(h1Dom);
        // console.log(h1React);

        //6
        //DOM
        const ulDOM = document.createElement("ul");
        ulDOM.id = "ul-id";
        ulDOM.style = "color: red; font-size: 30px";

        const liDOM1 = document.createElement("li");
        liDOM1.id = "li-1";
        liDOM1.innerText = "Javascript";

        const liDOM2 = document.createElement("li");
        liDOM2.innerText = "React";

        ulDOM.appendChild(liDOM1);
        ulDOM.appendChild(liDOM2);

        document.body.appendChild(ulDOM);

        //React
        const ulReact = React.createElement(
            "ul",
            {
                id: "ul-id2",
                style: "color: red; font-size: 30px"

            },
            React.createElement('li', { id: 'li-1' }, 'javascript'),
            React.createElement('li', null, 'Reactjs'),


        )

        console.log(ulReact);

        //7
        const postItem = React.createElement(
            "div",
            { className: "post-item" },
            React.createElement(
                "h2",
                { title: "Học React tại F8" },
                "Học ReactJS"
            ),
            React.createElement(
                "p",
                null,
                "Học ReactJS từ cơ bản tới nâng cao"
            )
        );

        console.log(postItem);



    </script>


</body>

</html>
